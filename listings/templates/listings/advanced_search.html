{% extends "listings/layout.html" %}

{% block title %}Advanced Search{% endblock %}

{% block content %}

<div class="p-4 p-lg-5">
<div class="table-wrap rounded-4 p-3">

<h3 class="mb-4">Advanced Search</h3>

<form method="get" action="{% url 'search_results' %}">

{% if country %}
    <input
        type="hidden"
        name="country"
        value="{{ country }}"
    >
{% endif %}


<!-- Platforms -->

<div class="stat-card mb-4">

    <div class="card-header">
        <h2 class="h5 mb-4">Platform</h2>
    </div>

    <div class="card-body">

        <div class="dropdown">

            <button
                id="platformDropdownButton"
                class="btn btn-outline-primary dropdown-toggle text-start"
                type="button"
                data-bs-toggle="dropdown"
                data-bs-auto-close="outside"
                aria-expanded="false"
            >
                Select Platform
            </button>


            <div class="dropdown-menu platform-dropdown p-3">

                {% for platform in platforms %}

                    <div class="form-check">

                        <input
                            class="form-check-input platform-checkbox"
                            type="checkbox"
                            name="platforms"
                            value="{{ platform.slug }}"
                            id="platform-{{ forloop.counter }}"
                        >

                        <label
                            class="form-check-label"
                            for="platform-{{ forloop.counter }}"
                        >
                            {{ platform.name }}
                        </label>

                    </div>

                {% endfor %}

            </div>

        </div>

    </div>

</div>


<!-- Price Range -->

<div class="stat-card mb-4">

    <div class="card-header">
        <h2 class="h5 mb-4">Price Range</h2>
    </div>

    <div class="card-body">

        <div class="row">
            <!-- Minimum -->
            <div class="col-md-4">
                <label for="min-price" class="form-label">Minimum</label>

                <input
                    type="number"
                    name="min_price"
                    id="min-price"
                    class="form-control mb-2"
                    min="0"
                    step="1"
                    placeholder="0.00"
                >

                <input
                    type="range"
                    id="min-price-slider"
                    class="form-range"
                    min="0"
                    max="1000"
                    step="5"
                    value="0"
                >
            </div>

            <!-- Maximum -->
            <div class="col-md-4">
                <label for="max-price" class="form-label">Maximum</label>

                <input
                    type="number"
                    name="max_price"
                    id="max-price"
                    class="form-control mb-2"
                    min="0"
                    step="1"
                    placeholder="Max"
                >

                <input
                    type="range"
                    id="max-price-slider"
                    class="form-range"
                    min="0"
                    max="1000"
                    step="5"
                    value="1000"
                >
            </div>
        </div>

    </div>

</div>


<!-- Price Drops -->
<div class="stat-card mb-4">
<div class="form-check form-switch">
    <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        name="price_drops"
        value="1"
        id="priceDrops"
        {% if request.GET.price_drops %}checked{% endif %}
    >
    <label class="form-check-label" for="priceDrops">
        <span class="mx-3" >Listings with price drops</span>
    </label>
</div>
</div>


<!-- Search button -->

<div class="d-grid d-md-flex justify-content-md-end mb-4">

    <button
        type="submit"
        class="btn btn-primary px-5"
    >
        Search
    </button>

</div>


</form>

</div>
</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const button = document.getElementById(
        "brandDropdownButton"
    );

    const checkboxes = document.querySelectorAll(
        ".brand-checkbox"
    );


    function updateBrandButton() {

        const selected = [];


        checkboxes.forEach(function (checkbox) {

            if (checkbox.checked) {

                const label = document.querySelector(
                    'label[for="' +
                    checkbox.id +
                    '"]'
                );

                selected.push(
                    label.textContent.trim()
                );

            }

        });


        if (selected.length === 0) {

            button.textContent = "Select Brands";

        } else if (selected.length <= 2) {

            button.textContent = selected.join(
                ", "
            );

        } else {

            button.textContent =
                selected.length +
                " brands selected";

        }

    }


    checkboxes.forEach(function (checkbox) {

        checkbox.addEventListener(
            "change",
            updateBrandButton
        );

    });

});

    const minPrice = document.getElementById("min-price");
    const minSlider = document.getElementById("min-price-slider");

    const maxPrice = document.getElementById("max-price");
    const maxSlider = document.getElementById("max-price-slider");

    minSlider.addEventListener("input", function () {
        minPrice.value = this.value;
    });

    maxSlider.addEventListener("input", function () {
        maxPrice.value = this.value;
    });

    minPrice.addEventListener("input", function () {
        minSlider.value = this.value;
    });

    maxPrice.addEventListener("input", function () {
        maxSlider.value = this.value;
    });

</script>

{% endblock %}
